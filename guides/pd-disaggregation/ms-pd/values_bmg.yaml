# Intel BMG (Battlemage G21) configuration for P/D Disaggregation
# Quick reference values file with NIXL configuration

multinode: false

# Configure accelerator type for Intel BMG
accelerator:
  type: intel
  resources:
    intel: "gpu.intel.com/xe"  # BMG uses 'xe' resource type (not 'i915')

# Model configuration - using smaller model suitable for BMG
modelArtifacts:
  uri: "hf://deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"
  size: 10Gi
  authSecretName: "llm-d-hf-token"
  name: "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"

# Routing configuration with NIXL for KV cache transfer
routing:
  servicePort: 8000
  proxy:
    image: ghcr.io/llm-d/llm-d-routing-sidecar:v0.3.0
    connector: nixlv2  # NIXL v2 for KV cache transfer
    secure: false

  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      # name: set in helmfile

  inferencePool:
    create: false

  # Create HTTPRoute via modelservice chart
  httpRoute:
    create: true

  epp:
    create: false

# Decode service configuration
decode:
  create: true
  replicas: 1  # Single decode instance

  monitoring:
    podmonitor:
      enabled: true
      portName: "metrics"
      path: "/metrics"
      interval: "30s"

  containers:
  - name: "vllm"
    image: ghcr.io/llm-d/llm-d-xpu:v0.3.1
    modelCommand: vllmServe

    # vLLM arguments for decode with NIXL
    args:
      - "--block-size"
      - "128"
      - "--kv-transfer-config"
      - '{"kv_connector":"NixlConnector", "kv_role":"kv_both", "kv_buffer_device":"cpu"}'
      - "--disable-log-requests"
      - "--disable-uvicorn-access-log"
      - "--max-model-len"
      - "32000"

    # Security context for Intel GPUs
    securityContext:
      fsGroup: 107
      supplementalGroups:
        - 107

    # Environment variables for BMG with NIXL
    env:
      # UCX transport: Use TCP for BMG (not RDMA)
      - name: UCX_TLS
        value: "tcp"

      # NIXL side channel configuration
      - name: VLLM_NIXL_SIDE_CHANNEL_HOST
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      - name: VLLM_NIXL_SIDE_CHANNEL_PORT
        value: "5557"

      # Intel XPU configuration
      - name: VLLM_WORKER_MULTIPROC_METHOD
        value: "spawn"
      - name: VLLM_TARGET_DEVICE
        value: "xpu"

    # Container ports
    ports:
      - containerPort: 8200
        name: metrics
        protocol: TCP
      - containerPort: 5557
        name: nixl-side
        protocol: TCP

    # Resource allocation for decode
    resources:
      limits:
        memory: 64Gi
        cpu: "16"
        gpu.intel.com/xe: 1  # BMG GPU resource
      requests:
        memory: 64Gi
        cpu: "16"
        gpu.intel.com/xe: 1

    # Volume mounts
    mountModelVolume: true
    volumeMounts:
      - name: dshm
        mountPath: /dev/shm

  # Volumes for decode
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 4Gi

# Prefill service configuration
prefill:
  create: true
  replicas: 3  # Multiple prefill instances

  monitoring:
    podmonitor:
      enabled: true
      portName: "metrics"
      path: "/metrics"
      interval: "30s"

  containers:
  - name: "vllm"
    image: ghcr.io/llm-d/llm-d-xpu:v0.3.1
    modelCommand: vllmServe

    # vLLM arguments for prefill with NIXL
    args:
      - "--block-size"
      - "128"
      - "--kv-transfer-config"
      - '{"kv_connector":"NixlConnector", "kv_role":"kv_both", "kv_buffer_device":"cpu"}'
      - "--disable-log-requests"
      - "--disable-uvicorn-access-log"
      - "--max-model-len"
      - "32000"

    # Security context for Intel GPUs
    securityContext:
      fsGroup: 107
      supplementalGroups:
        - 107

    # Environment variables for BMG with NIXL
    env:
      # UCX transport: Use TCP for BMG (not RDMA)
      - name: UCX_TLS
        value: "tcp"

      # NIXL side channel configuration
      - name: VLLM_NIXL_SIDE_CHANNEL_HOST
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      - name: VLLM_NIXL_SIDE_CHANNEL_PORT
        value: "5557"

      # Intel XPU configuration
      - name: VLLM_WORKER_MULTIPROC_METHOD
        value: "spawn"
      - name: VLLM_TARGET_DEVICE
        value: "xpu"

    # Container ports
    ports:
      - containerPort: 8000
        name: metrics
        protocol: TCP
      - containerPort: 5557
        name: nixl-side
        protocol: TCP

    # Resource allocation for prefill
    resources:
      limits:
        memory: 64Gi
        cpu: "8"
        gpu.intel.com/xe: 1  # BMG GPU resource
      requests:
        memory: 64Gi
        cpu: "8"
        gpu.intel.com/xe: 1

    # Volume mounts
    mountModelVolume: true
    volumeMounts:
      - name: dshm
        mountPath: /dev/shm

  # Volumes for prefill
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 4Gi
